name: Feature dynamic stacked validation

on:
  push:
    branches: [feat/dynamic-task-submission]

permissions:
  contents: read

jobs:
  rust:
    name: Rust stacked (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compose current stacked base without publishing it
        run: |
          git config user.name "stacked-validation"
          git config user.email "stacked-validation@localhost"
          git fetch origin feat/runtime-process-supervision
          git merge --no-edit --no-commit origin/feat/runtime-process-supervision
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --manifest-path rust/Cargo.toml --all-features
      - name: Release build
        run: cargo build --release --manifest-path rust/Cargo.toml --all-features
      - name: Doctor
        run: cargo run --manifest-path rust/Cargo.toml -- doctor
      - name: Review
        run: cargo run --manifest-path rust/Cargo.toml -- review --plan docs/workflow_plan_example.json
      - name: Dry-run
        run: cargo run --manifest-path rust/Cargo.toml -- dry-run --plan docs/workflow_plan_example.json --force --run-id ci-dry
      - name: Mock E2E
        run: cargo run --manifest-path rust/Cargo.toml -- run --plan docs/workflow_plan_example.json --force --run-id ci-e2e --global-max-concurrency 3 --provider-cap mock=3
      - name: Dynamic submit, recovery, and admission E2E
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          rm -rf .agent/swarm/runs/ci-dynamic bench_apps/reshard docs/bench_notes/reshard_plan.md bench_tests/test_bench_reshard.py
          cargo run --manifest-path rust/Cargo.toml -- run --plan docs/workflow_plan_example.json --force --run-id ci-dynamic --global-max-concurrency 3 --provider-cap mock=3
          cat > "$RUNNER_TEMP/dynamic-submission.json" <<'JSON'
          {
            "submission_version": 1,
            "stage": "Dynamic",
            "parallel": true,
            "task": {
              "id": "postcheck",
              "route": "mock",
              "task": "Run pytest",
              "role": "general",
              "needs": ["tests"],
              "tools_policy": "none",
              "artifacts": [],
              "verify": []
            }
          }
          JSON
          cargo run --manifest-path rust/Cargo.toml -- submit --workspace-root "$PWD" --run-id ci-dynamic --task-file "$RUNNER_TEMP/dynamic-submission.json"
          python - <<'PY'
          from pathlib import Path
          run = Path('.agent/swarm/runs/ci-dynamic')
          pending = list((run / 'submissions' / 'pending').glob('*.json'))
          assert len(pending) == 1, f'expected one durable pending submission, got {pending}'
          PY
          cargo run --manifest-path rust/Cargo.toml -- run --plan docs/workflow_plan_example.json --resume --run-id ci-dynamic --global-max-concurrency 3 --provider-cap mock=3
          python - <<'PY'
          import json
          from pathlib import Path
          run = Path('.agent/swarm/runs/ci-dynamic')
          assert not list((run / 'submissions' / 'pending').glob('*.json'))
          accepted = list((run / 'submissions' / 'accepted').glob('*.json'))
          assert len(accepted) == 1, f'expected one accepted submission, got {accepted}'
          states = [json.loads(path.read_text()) for path in (run / 'tasks').glob('*.json')]
          dynamic = [state for state in states if state.get('source_id') == 'postcheck']
          assert len(dynamic) == 1, f'expected one dynamic state, got {dynamic}'
          assert dynamic[0].get('status') == 'completed', dynamic[0]
          workflow_path = run / 'workflow.json'
          workflow = json.loads(workflow_path.read_text())
          assert workflow.get('task_count') == 5, workflow
          workflow['task_count'] = 4
          workflow_path.write_text(json.dumps(workflow, indent=2) + '\n')
          PY
          cargo run --manifest-path rust/Cargo.toml -- run --plan docs/workflow_plan_example.json --resume --run-id ci-dynamic --global-max-concurrency 3 --provider-cap mock=3
          python - <<'PY'
          import json
          from pathlib import Path
          run = Path('.agent/swarm/runs/ci-dynamic')
          workflow = json.loads((run / 'workflow.json').read_text())
          assert workflow.get('task_count') == 5, f'resume did not reconcile stale task_count: {workflow}'
          accepted = list((run / 'submissions' / 'accepted').glob('*.json'))
          assert len(accepted) == 1, f'resume duplicated accepted history: {accepted}'
          states = [json.loads(path.read_text()) for path in (run / 'tasks').glob('*.json')]
          dynamic = [state for state in states if state.get('source_id') == 'postcheck']
          assert len(dynamic) == 1, f'resume duplicated dynamic task state: {dynamic}'
          assert dynamic[0].get('status') == 'completed', dynamic[0]
          PY
          cat > "$RUNNER_TEMP/stage-policy-bypass.json" <<'JSON'
          {
            "submission_version": 1,
            "stage": "Verification",
            "parallel": true,
            "task": {
              "id": "serial-stage-bypass",
              "route": "mock",
              "task": "Run pytest",
              "role": "general",
              "needs": ["tests"],
              "tools_policy": "none",
              "artifacts": [],
              "verify": []
            }
          }
          JSON
          cargo run --manifest-path rust/Cargo.toml -- submit --workspace-root "$PWD" --run-id ci-dynamic --task-file "$RUNNER_TEMP/stage-policy-bypass.json"
          cargo run --manifest-path rust/Cargo.toml -- run --plan docs/workflow_plan_example.json --resume --run-id ci-dynamic --global-max-concurrency 3 --provider-cap mock=3
          python - <<'PY'
          import json
          from pathlib import Path
          run = Path('.agent/swarm/runs/ci-dynamic')
          rejected = list((run / 'submissions' / 'rejected').glob('*.json'))
          assert len(rejected) == 1, f'expected one rejected stage-policy submission, got {rejected}'
          error = rejected[0].with_suffix('.error.txt').read_text()
          assert "existing stage uses parallel=false" in error, error
          accepted = list((run / 'submissions' / 'accepted').glob('*.json'))
          assert len(accepted) == 1, f'rejected submission altered accepted history: {accepted}'
          states = [json.loads(path.read_text()) for path in (run / 'tasks').glob('*.json')]
          assert not any(state.get('source_id') == 'serial-stage-bypass' for state in states), states
          workflow = json.loads((run / 'workflow.json').read_text())
          assert workflow.get('task_count') == 5, workflow
          PY
