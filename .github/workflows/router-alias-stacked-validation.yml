name: Router alias stacked validation

on:
  push:
    branches:
      - fix/router-alias-resolution

permissions:
  contents: read

concurrency:
  group: router-alias-stacked-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Temporary full validation for the stacked PR head; remove after green.
    name: Rust stacked (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --manifest-path rust/Cargo.toml --all-features
      - name: Release build
        run: cargo build --release --manifest-path rust/Cargo.toml --all-features
      - name: Doctor
        run: cargo run --manifest-path rust/Cargo.toml -- doctor
      - name: Review
        run: cargo run --manifest-path rust/Cargo.toml -- review --plan docs/workflow_plan_example.json
      - name: Validate local router example
        run: cargo run --manifest-path rust/Cargo.toml -- review --plan docs/workflow_plan_example.json --router-config config/swarm_router.local.example.json
      - name: Dry-run
        run: cargo run --manifest-path rust/Cargo.toml -- dry-run --plan docs/workflow_plan_example.json --force --run-id ci-dry
      - name: Mock E2E
        run: cargo run --manifest-path rust/Cargo.toml -- run --plan docs/workflow_plan_example.json --force --run-id ci-e2e --global-max-concurrency 3 --provider-cap mock=3
