name: Feature clippy diagnostics

on:
  push:
    branches:
      - feat/runtime-process-supervision

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/runtime-process-supervision
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Remove tests for retired helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rust/src/tests.rs')
          text = path.read_text(encoding='utf-8')
          start = text.index('/// A child that exits quickly completes normally under a generous deadline.')
          end = text.index('/// A verification command that hangs is rejected by execute_shell instead of', start)
          text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Capture Clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings > .github/clippy-diagnostics.txt 2>&1
          status=$?
          echo "exit_status=$status" >> .github/clippy-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src .github/clippy-diagnostics.txt
          git commit -m 'test(runtime): remove obsolete bounded-wait helper tests'
          git push origin HEAD:feat/runtime-process-supervision
