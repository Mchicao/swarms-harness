name: Feature clippy diagnostics

on:
  push:
    branches:
      - feat/runtime-process-supervision

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/runtime-process-supervision
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          supervisor = Path('rust/src/process_supervisor.rs')
          text = supervisor.read_text(encoding='utf-8')
          text = text.replace('if unsafe { setpgid(0, 0) } == 0 {', 'if setpgid(0, 0) == 0 {')
          supervisor.write_text(text, encoding='utf-8')

          runtime = Path('rust/src/runtime.rs')
          text = runtime.read_text(encoding='utf-8')
          start = text.index('/// Compatibility helper retained for focused tests and callers.')
          end = text.index('pub(crate) fn run_verify_commands(', start)
          text = text[:start] + text[end:]
          runtime.write_text(text, encoding='utf-8')
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Capture Clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings > .github/clippy-diagnostics.txt 2>&1
          status=$?
          echo "exit_status=$status" >> .github/clippy-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src .github/clippy-diagnostics.txt
          git commit -m 'fix(runtime): resolve process supervision clippy failures'
          git push origin HEAD:feat/runtime-process-supervision
