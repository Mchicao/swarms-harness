name: Feature clippy diagnostics

on:
  push:
    branches:
      - feat/runtime-process-supervision

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/runtime-process-supervision
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Capture Clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings > .github/clippy-diagnostics.txt 2>&1
          status=$?
          echo "exit_status=$status" >> .github/clippy-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/clippy-diagnostics.txt
          git commit -m 'ci: record clippy diagnostics'
          git push origin HEAD:feat/runtime-process-supervision
