name: Feature runtime fix tests

on:
  push:
    branches:
      - feat/runtime-process-supervision

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/runtime-process-supervision
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Update timeout semantics test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rust/src/tests.rs')
          text = path.read_text(encoding='utf-8')
          old = '''#[test]\nfn legacy_timeout_fields_never_create_a_worker_deadline() {\n    let mut task = make_task("long", &[], "mock");\n    task.spec.timeout_seconds = Some(1);\n    let plan = model::Plan {\n        schema_version: None,\n        goal: None,\n        project: None,\n        planner: None,\n        review_policy: None,\n        budget_policy: model::BudgetPolicy::default(),\n        stages: Vec::new(),\n        thinking: None,\n        session: None,\n        execution: model::ExecutionConfig::default(),\n        terminal: model::TerminalConfig::default(),\n        default_timeout_seconds: Some(1),\n        default_max_attempts: None,\n        scaling: None,\n    };\n    assert_eq!(task.spec.effective_timeout(&plan), None);\n}\n'''
          new = '''#[test]\nfn worker_timeout_is_opt_in_with_task_override_and_plan_fallback() {\n    let mut task = make_task("long", &[], "mock");\n    let mut plan = model::Plan {\n        schema_version: None,\n        goal: None,\n        project: None,\n        planner: None,\n        review_policy: None,\n        budget_policy: model::BudgetPolicy::default(),\n        stages: Vec::new(),\n        thinking: None,\n        session: None,\n        execution: model::ExecutionConfig::default(),\n        terminal: model::TerminalConfig::default(),\n        default_timeout_seconds: Some(30),\n        default_max_attempts: None,\n        scaling: None,\n    };\n\n    assert_eq!(task.spec.effective_timeout(&plan), Some(30));\n\n    task.spec.timeout_seconds = Some(5);\n    assert_eq!(task.spec.effective_timeout(&plan), Some(5));\n\n    task.spec.timeout_seconds = Some(0);\n    assert_eq!(task.spec.effective_timeout(&plan), None);\n\n    task.spec.timeout_seconds = None;\n    plan.default_timeout_seconds = Some(0);\n    assert_eq!(task.spec.effective_timeout(&plan), None);\n}\n'''
          if old not in text:
              raise SystemExit('stale timeout test anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Validate
        shell: bash
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --all-features
      - name: Commit fix and remove temporary diagnostics
        shell: bash
        run: |
          git rm -f .github/windows-clippy.txt .github/ubuntu-tests.txt .github/workflows/feature-runtime-diagnostics.yml .github/workflows/feature-runtime-fix-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rust/src/tests.rs
          git commit -m 'test(runtime): align timeout coverage with supervision semantics'
          git push origin HEAD:feat/runtime-process-supervision
