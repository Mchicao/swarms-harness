name: Persistent process-tree hardening

on:
  push:
    branches:
      - fix/persistent-transport-supervision

permissions:
  contents: write

concurrency:
  group: persistent-process-tree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(runtime): supervise persistent process trees'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply fail-closed source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'rust/src/adapter.rs',
              'use crate::model::{AcpConfig, Provider, Task, ThinkingLevel};\n',
              'use crate::model::{AcpConfig, Provider, Task, ThinkingLevel};\nuse crate::process_supervisor;\n',
          )
          replace_once(
              'rust/src/adapter.rs',
              'use std::process::Child;\n',
              'use std::process::Child;\nuse std::time::Duration;\n',
          )
          replace_once(
              'rust/src/adapter.rs',
              '''impl ChildGuard {
    pub(crate) fn new(child: Child) -> Self {
        Self(child)
    }
}
''',
              '''impl ChildGuard {
    pub(crate) fn new(child: Child) -> Self {
        Self(child)
    }

    pub(crate) fn terminate_tree(&mut self) -> Result<()> {
        process_supervisor::terminate_tree(&mut self.0, Duration::from_secs(1))
    }
}
''',
          )
          replace_once(
              'rust/src/adapter.rs',
              '''impl Drop for ChildGuard {
    fn drop(&mut self) {
        let _ = self.0.kill();
        let _ = self.0.wait();
    }
}
''',
              '''impl Drop for ChildGuard {
    fn drop(&mut self) {
        let _ = self.terminate_tree();
    }
}
''',
          )

          replace_once(
              'rust/src/codex_app_server.rs',
              'use crate::model::{Task, ThinkingLevel};\n',
              'use crate::model::{Task, ThinkingLevel};\nuse crate::process_supervisor;\n',
          )
          replace_once(
              'rust/src/codex_app_server.rs',
              '''    let program = which("codex").unwrap_or_else(|| "codex".to_string());
    let mut child = ChildGuard::new(
        Command::new(program)
            .args(["app-server", "--stdio"])
            .current_dir(cwd)
            .stdin(Stdio::piped())
            .stdout(Stdio::piped())
            .stderr(Stdio::piped())
            .spawn()
            .map_err(|error| format!("spawn codex app-server: {error}"))?,
    );
''',
              '''    let program = which("codex").unwrap_or_else(|| "codex".to_string());
    let mut command = Command::new(program);
    command
        .args(["app-server", "--stdio"])
        .current_dir(cwd)
        .stdin(Stdio::piped())
        .stdout(Stdio::piped())
        .stderr(Stdio::piped());
    process_supervisor::prepare_command(&mut command)?;
    let mut child = ChildGuard::new(
        command
            .spawn()
            .map_err(|error| format!("spawn codex app-server: {error}"))?,
    );
''',
          )
          replace_once(
              'rust/src/codex_app_server.rs',
              '                    let _ = child.kill();\n',
              '                    let _ = child.terminate_tree();\n',
          )

          replace_once(
              'rust/src/opencode_server.rs',
              'use crate::model::{Task, ThinkingLevel};\n',
              'use crate::model::{Task, ThinkingLevel};\nuse crate::process_supervisor;\n',
          )
          replace_once(
              'rust/src/opencode_server.rs',
              '''    if !task.spec.allows_workspace_write() {
        command.arg("--pure");
    }
    let mut child = ChildGuard::new(
''',
              '''    if !task.spec.allows_workspace_write() {
        command.arg("--pure");
    }
    process_supervisor::prepare_command(&mut command)?;
    let mut child = ChildGuard::new(
''',
          )
          replace_once(
              'rust/src/opencode_server.rs',
              '''    let _ = child.kill();
    let _ = child.wait();
''',
              '''    let _ = child.terminate_tree();
''',
          )

          replace_once(
              'rust/src/claude_stream.rs',
              'use crate::model::{Task, ThinkingLevel};\n',
              'use crate::model::{Task, ThinkingLevel};\nuse crate::process_supervisor;\n',
          )
          replace_once(
              'rust/src/claude_stream.rs',
              '''            let result = if steer.mode.as_str() == "cancel_and_restart" {
                let _ = child.kill();
                let _ = child.wait();
''',
              '''            let result = if steer.mode.as_str() == "cancel_and_restart" {
                let _ = child.terminate_tree();
''',
          )
          replace_once(
              'rust/src/claude_stream.rs',
              '''    let _ = child.kill();
    let status = child.wait().map_err(|error| error.to_string())?;
    if !status.success() && output.is_empty() {
        return Err(format!("claude stream exited {:?}", status.code()));
    }
''',
              '''    let status = child.try_wait().map_err(|error| error.to_string())?;
    if status.is_none() {
        child.terminate_tree()?;
    }
    if status.is_some_and(|status| !status.success()) && output.is_empty() {
        return Err(format!("claude stream exited {:?}", status.and_then(|status| status.code())));
    }
''',
          )
          replace_once(
              'rust/src/claude_stream.rs',
              '''    if task.spec.tools_policy == "full" {
        command.arg("--dangerously-skip-permissions");
    }
    let mut child = ChildGuard::new(
''',
              '''    if task.spec.tools_policy == "full" {
        command.arg("--dangerously-skip-permissions");
    }
    process_supervisor::prepare_command(&mut command)?;
    let mut child = ChildGuard::new(
''',
          )

          replace_once(
              'rust/src/acp.rs',
              'use serde_json::{json, Value};\n',
              'use crate::process_supervisor;\nuse serde_json::{json, Value};\n',
          )
          replace_once(
              'rust/src/acp.rs',
              '''        #[cfg(windows)]
        {
            use std::os::windows::process::CommandExt;
            command.creation_flags(0x0800_0000);
        }
        let mut child = command
''',
              '''        #[cfg(windows)]
        {
            use std::os::windows::process::CommandExt;
            command.creation_flags(0x0800_0000);
        }
        process_supervisor::prepare_command(&mut command)?;
        let mut child = command
''',
          )
          replace_once(
              'rust/src/acp.rs',
              '''        let _ = self.child.kill();
        let _ = self.child.wait();
''',
              '''        let _ = process_supervisor::terminate_tree(&mut self.child, self.cancel_grace);
''',
          )
          PY
      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --manifest-path rust/Cargo.toml --all-features
      - name: Diff check
        run: git diff --check
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src/adapter.rs rust/src/acp.rs rust/src/codex_app_server.rs rust/src/opencode_server.rs rust/src/claude_stream.rs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(runtime): supervise persistent process trees"
          git push

  validate:
    if: github.event.head_commit.message == 'fix(runtime): supervise persistent process trees'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --all-features
      - run: cargo build --release --manifest-path rust/Cargo.toml --all-features
      - run: cargo run --manifest-path rust/Cargo.toml -- doctor
      - run: cargo run --manifest-path rust/Cargo.toml -- review --plan docs/workflow_plan_example.json
      - run: cargo run --manifest-path rust/Cargo.toml -- dry-run --plan docs/workflow_plan_example.json --force --run-id ci-dry
      - run: cargo run --manifest-path rust/Cargo.toml -- run --plan docs/workflow_plan_example.json --force --run-id ci-e2e --global-max-concurrency 3 --provider-cap mock=3
