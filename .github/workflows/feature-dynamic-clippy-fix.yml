name: Feature dynamic clippy fix

on:
  push:
    branches: [feat/dynamic-task-submission]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/dynamic-task-submission
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Box accepted task only while transporting the decision
        shell: python
        run: |
          from pathlib import Path

          dynamic = Path('rust/src/dynamic_submission.rs')
          text = dynamic.read_text()
          old_enum = '    Accepted { task: Task, file_name: String },'
          new_enum = '    Accepted { task: Box<Task>, file_name: String },'
          if text.count(old_enum) != 1:
              raise SystemExit(f'expected one enum occurrence, got {text.count(old_enum)}')
          text = text.replace(old_enum, new_enum)

          old_accept = '''                tasks.push(task.clone());\n                decisions.push(SubmissionDecision::Accepted { task, file_name });'''
          new_accept = '''                let task = Box::new(task);\n                tasks.push(task.as_ref().clone());\n                decisions.push(SubmissionDecision::Accepted { task, file_name });'''
          if text.count(old_accept) != 1:
              raise SystemExit(f'expected one accepted-construction occurrence, got {text.count(old_accept)}')
          dynamic.write_text(text.replace(old_accept, new_accept))

          runtime = Path('rust/src/runtime.rs')
          text = runtime.read_text()
          old_runtime = '''                    let source_id = task.source_id.clone();\n                    tasks.push(task);'''
          new_runtime = '''                    let source_id = task.source_id.clone();\n                    tasks.push(*task);'''
          if text.count(old_runtime) != 1:
              raise SystemExit(f'expected one scheduler push occurrence, got {text.count(old_runtime)}')
          runtime.write_text(text.replace(old_runtime, new_runtime))
      - name: Remove this temporary workflow
        run: rm .github/workflows/feature-dynamic-clippy-fix.yml
      - name: Validate delta shape
        run: |
          cargo fmt --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src/dynamic_submission.rs rust/src/runtime.rs .github/workflows/feature-dynamic-clippy-fix.yml
          git commit -m "fix(runtime): bound dynamic submission decision size"
          git push origin HEAD:feat/dynamic-task-submission
