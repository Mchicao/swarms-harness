name: Feature dynamic conflict fix

on:
  push:
    branches: [feat/dynamic-task-submission]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/dynamic-task-submission
          fetch-depth: 0
      - name: Remove obsolete bounded-wait compatibility helper
        shell: python
        run: |
          from pathlib import Path
          path = Path('rust/src/runtime.rs')
          text = path.read_text()
          start = text.index('/// Compatibility helper retained for focused tests and callers. Production\n')
          end = text.index('pub(crate) fn run_verify_commands(', start)
          block = text[start:end]
          if 'pub(crate) fn wait_bounded(' not in block:
              raise SystemExit('expected wait_bounded helper not found in target block')
          text = text[:start] + text[end:]
          path.write_text(text)
      - name: Remove this temporary workflow
        run: rm .github/workflows/feature-dynamic-conflict-fix.yml
      - name: Format and sanity check
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src/runtime.rs .github/workflows/feature-dynamic-conflict-fix.yml
          git commit -m "fix(runtime): drop obsolete bounded-wait helper from dynamic branch"
          git push origin HEAD:feat/dynamic-task-submission
