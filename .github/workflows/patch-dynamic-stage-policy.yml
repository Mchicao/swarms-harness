name: Patch dynamic stage policy

on:
  push:
    branches: [feat/dynamic-task-submission]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/dynamic-task-submission
          fetch-depth: 0
      - name: Reject inconsistent existing-stage parallel policy
        shell: python
        run: |
          from pathlib import Path
          path = Path('rust/src/dynamic_submission.rs')
          text = path.read_text()
          anchor = '''fn validation_plan(plan: &Plan, tasks: &[Task], submission: &TaskSubmission) -> Plan {\n'''
          helper = '''fn validate_stage_policy(current_tasks: &[Task], submission: &TaskSubmission) -> Result<()> {\n    if let Some(existing) = current_tasks\n        .iter()\n        .find(|task| task.stage == submission.stage && task.stage_parallel != submission.parallel)\n    {\n        return Err(format!(\n            "submission stage '{}' declares parallel={} but existing stage uses parallel={}",\n            submission.stage, submission.parallel, existing.stage_parallel\n        ));\n    }\n    Ok(())\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one validation_plan anchor, got {text.count(anchor)}')
          text = text.replace(anchor, helper + anchor)
          old = '''    let candidate_plan = validation_plan(plan, current_tasks, submission);\n'''
          new = '''    validate_stage_policy(current_tasks, submission)?;\n    let candidate_plan = validation_plan(plan, current_tasks, submission);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one candidate plan line, got {text.count(old)}')
          path.write_text(text.replace(old, new))
      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/patch-dynamic-stage-policy.yml
      - name: Format and diff check
        shell: bash
        run: |
          cargo fmt --manifest-path rust/Cargo.toml
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src/dynamic_submission.rs .github/workflows/patch-dynamic-stage-policy.yml
          git commit -m "fix(runtime): preserve stage parallel semantics for submissions"
          git push origin HEAD:feat/dynamic-task-submission
