name: Feature lock validation

on:
  push:
    branches: [feat/runtime-process-supervision]

permissions:
  contents: read

jobs:
  unix:
    name: Unix lock lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and Clippy
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -- --check
          cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Repeat sequential resume lifecycle
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            cargo test --manifest-path rust/Cargo.toml tests::resume_keeps_completed_tasks -- --exact
          done
      - name: Full tests
        run: cargo test --manifest-path rust/Cargo.toml --all-features
