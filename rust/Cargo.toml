[package]
name = "swarms-runtime"
version = "0.2.0"
edition = "2021"
description = "Deterministic, self-contained SWARMS workflow coordinator."
license = "MIT"
default-run = "swarms-rs"

[[bin]]
name = "swarms-rs"
path = "src/main.rs"

[lib]
name = "swarms_runtime"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
